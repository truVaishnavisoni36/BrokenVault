[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brokenvault"
version = "1.0.0"
description = "A small resumable, content-addressed client-server backup system"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "uvicorn==0.34.0",
  "pydantic==2.10.4",
]

[project.scripts]
bv = "client.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
